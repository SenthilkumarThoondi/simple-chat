verify_signatures: false

PrePush:
  Brakeman:
    enabled: true

PreCommit:
  RuboCop:
    enabled: true
    on_warn: fail
    problem_on_unmodified_line: ignore
    exclude:
      - db/schema.rb
      - test/**/*.rb
      - Gemfile

  BundleAudit:
    enabled: true
    on_warn: fail
    problem_on_unmodified_line: ignore