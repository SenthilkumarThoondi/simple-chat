AllCops:
  NewCops: enable
  EnabledByDefault: false
  Exclude:
    - db/schema.rb
    - db/migrate/20250327043021_create_active_storage_tables.active_storage.rb
    - db/seeds.rb

Layout/LineLength:
  Max: 120
  AllowedPatterns:
    - '^\s*#'

Metrics/MethodLength:
  Max: 15
  Exclude:
    - db/migrate/*.rb